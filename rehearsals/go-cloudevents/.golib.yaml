schema_version: 1
tool_version: v1.0.0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
api:
  baselines:
  - module: "."
    mode: apidiff
    path: api/baseline.txt
  - module: adapters/golib
    mode: apidiff
    path: adapters/golib/api/baseline.txt
operations:
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages:
    - "."
    fuzz: FuzzDecodeJSON
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: FuzzDecodeJSONBatch
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: FuzzDecodeHTTP
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: FuzzDecodeKafka
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages:
    - "./..."
    benchmark: "."
    budget: 100ms
    timeout: 20m
- module: adapters/golib
  gate: fuzz
  steps:
  - type: go-test
    packages:
    - "."
    fuzz: FuzzDecodeKafka
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: FuzzQueuePayloadRoundTrip
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: FuzzEventSourcingRoundTrip
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: FuzzOutboxRoundTrip
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: FuzzWorkflowRoundTrip
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: FuzzAuditCorrelationTenantMetadata
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "."
    fuzz: FuzzDirectJSONSchemaValidation
    budget: 100x
    timeout: 2m
- module: adapters/golib
  gate: benchmark
  steps:
  - type: go-test
    packages:
    - "./..."
    benchmark: "."
    budget: 100ms
    timeout: 20m
- module: "."
  gate: conformance
  steps:
  - type: make
    makefile: verification/package.mk
    target: conformance
    timeout: 20m
- module: "."
  gate: interoperability
  steps:
  - type: make
    makefile: verification/package.mk
    target: interoperability
    timeout: 20m
