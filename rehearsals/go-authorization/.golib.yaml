schema_version: 1
tool_version: v1.0.0
manifest:
  modules: modules.json
  packages: packages.json
evidence:
  root: ".verification"
mutation:
  root: ".verification/mutation"
operations:
- module: "."
  gate: api
  steps:
  - type: make
    makefile: verification/package.mk
    target: api
    timeout: 20m
- module: "."
  gate: fuzz
  steps:
  - type: go-test
    packages:
    - "./abac"
    fuzz: '^FuzzDecodeDocument$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./acl"
    fuzz: '^FuzzDecodeDocument$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./policy"
    fuzz: '^FuzzDecode$'
    budget: 100x
    timeout: 2m
  - type: go-test
    packages:
    - "./rbac"
    fuzz: '^FuzzDecodeDocument$'
    budget: 100x
    timeout: 2m
- module: "."
  gate: benchmark
  steps:
  - type: go-test
    packages:
    - "./..."
    benchmark: "."
    budget: 100ms
    timeout: 20m
