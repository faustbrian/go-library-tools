name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      ecosystem_milestone:
        description: Run aggregate catalog and compatibility milestone checks
        required: false
        type: boolean
        default: false
      native_cli_diagnostic:
        description: Diagnose the single retained CLI mutation without qualifying a release
        required: false
        type: boolean
        default: false
      release_rehearsal:
        description: Verify pre-tag security and candidate packaging without runtime campaigns
        required: false
        type: boolean
        default: false
      release_module:
        description: Rehearse exactly one module directory; blank rehearses every module
        required: false
        type: string
        default: ''
permissions:
  contents: read

concurrency:
  group: go-library-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: true
          vulnerability-check: true
          warn-only: false

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - &tooling-change-scope
        id: scope
        name: Select proportional assurance tier
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          runtime=true
          case "${EVENT_NAME}" in
            pull_request|push)
              [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'change classification requires an immutable base commit' >&2; exit 1; }
              git cat-file -e "${BASE_SHA}^{commit}"
              task="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/golib-tooling-scope.XXXXXX")"
              trap 'find "${task}" -depth -delete' EXIT
              git diff --no-ext-diff --no-textconv --no-renames --raw --no-abbrev -z "${BASE_SHA}" HEAD -- >"${task}/paths"
              [[ "$(wc -c <"${task}/paths")" -le 1048576 ]] || { echo 'changed path budget exceeded' >&2; exit 1; }
              runtime=false
              changed=false
              while IFS= read -r -d '' change; do
                IFS= read -r -d '' path || { echo 'incomplete changed path record' >&2; exit 1; }
                changed=true
                # Only regular, non-executable prose can take the metadata route.
                # Inspect both sides so deletion/retargeting cannot hide code.
                case "${change}" in
                  ':100644 100644 '*|':000000 100644 '*|':100644 000000 '*) ;;
                  *) runtime=true; break ;;
                esac
                case "${path}" in
                  *.md|LICENSE|LICENSE.txt|LICENSE.rst|NOTICE|NOTICE.txt|NOTICE.rst) ;;
                  *) runtime=true; break ;;
                esac
              done <"${task}/paths"
              [[ "${changed}" == true ]] || runtime=true
              ;;
            schedule|workflow_dispatch) ;;
            *) echo 'unsupported change event' >&2; exit 1 ;;
          esac
          echo "runtime=${runtime}" >>"${GITHUB_OUTPUT}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run fast local CI
        env:
          GOLIB_CHANGE_EVENT: ${{ github.event_name }}
          GOLIB_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GOLIB_RUNTIME_REQUIRED: ${{ steps.scope.outputs.runtime }}
        run: |
          set -euo pipefail
          case "${GOLIB_RUNTIME_REQUIRED}" in
            true) make local-ci ;;
            false) make metadata-ci ;;
            *) echo 'missing or invalid change classification' >&2; exit 1 ;;
          esac
      - name: Check tracked source documentation
        run: make source-docs-check
      - name: Check bounded runner observations
        run: PYTHONDONTWRITEBYTECODE=1 python3 .github/scripts/test-observe-runner.py
      - name: Verify finite workflow traversal regressions when affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" &&
            git diff --quiet "${BASE_SHA}" HEAD -- internal/gates/workflows.go \
              internal/gates/aaa_workflow_finite_preflight_internal_test.go .github/workflows/ci.yml; then
            exit 0
          fi
          original="internal/gates/workflows.go"
          backup_complete=0
          task="$(mktemp -d "${RUNNER_TEMP}/golib-workflow-finite.XXXXXX")"
          cleanup() {
            local failed=0
            if [[ "${backup_complete}" -eq 1 ]] && ! cp "${task}/workflows.go" "${original}"; then
              failed=1
            fi
            if ! chmod -R u+w "${task}"; then
              failed=1
            fi
            if ! find "${task}" -depth -delete; then
              failed=1
            fi
            return "${failed}"
          }
          trap 'status=$?; if ! cleanup; then status=1; fi; exit "${status}"' EXIT
          cp "${original}" "${task}/workflows.go"
          backup_complete=1
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          export GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" GOWORK=off
          export GOMAXPROCS=2
          go test -p 1 ./internal/gates -run '^TestWorkflowFinite' -count=1 -timeout=30s
          for mutation in alias-depth alias-stop lookup-alias-depth lookup-sequence-depth lookup-mapping-depth merge-stop empty-owner; do
            cp "${task}/workflows.go" "${original}"
            python3 - "${mutation}" <<'PY'
          import pathlib
          import sys
          path = pathlib.Path("internal/gates/workflows.go")
          replacements = {
              "alias-depth": ("node: current.node.Alias, path: current.path, depth: current.depth + 1", "node: current.node.Alias, path: current.path, depth: current.depth - 1"),
              "alias-stop": ("node: current.node.Alias, path: current.path, depth: current.depth + 1})\n\t\t\tcontinue", "node: current.node.Alias, path: current.path, depth: current.depth + 1})\n\t\t\tbreak"),
              "lookup-alias-depth": ("return workflowMappingValue(node.Alias, key, depth+1)", "return workflowMappingValue(node.Alias, key, depth-1)"),
              "lookup-sequence-depth": ("workflowMappingValue(candidate, key, depth+1)", "workflowMappingValue(candidate, key, depth-1)"),
              "lookup-mapping-depth": ("workflowMappingValue(merged, key, depth+1)", "workflowMappingValue(merged, key, depth-1)"),
              "merge-stop": ('if node.Content[index].Value != "<<" {\n\t\t\tcontinue', 'if node.Content[index].Value != "<<" {\n\t\t\tbreak'),
              "empty-owner": ("return at > 0 && immutableWorkflowRef", "return at >= 0 && immutableWorkflowRef"),
          }
          old, new = replacements[sys.argv[1]]
          source = path.read_text()
          if source.count(old) != 1:
              raise SystemExit("counterfactual source anchor is not unique")
          path.write_text(source.replace(old, new, 1))
          PY
            if go test -p 1 ./internal/gates -run '^TestWorkflowFinite' -count=1 -timeout=30s >"${task}/result" 2>&1; then
              echo "finite workflow regression missed ${mutation}"
              exit 1
            fi
            case "${mutation}" in
              lookup-*-depth) expected='lookup crossed the recursion allowance' ;;
              merge-stop) expected='finite admission' ;;
              *) expected='finite refusal' ;;
            esac
            grep -q -- '--- FAIL: TestWorkflowFinite' "${task}/result"
            grep -q -- "${expected}" "${task}/result"
            echo "finite workflow regression detects ${mutation}"
          done
          cp "${task}/workflows.go" "${original}"
          git diff --exit-code -- "${original}"
      - name: Verify finite process termination regression when affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" &&
            git diff --quiet "${BASE_SHA}" HEAD -- internal/gates/process_unix.go \
              internal/gates/process_test.go internal/gates/process_unix_internal_test.go \
              .github/workflows/ci.yml; then
            exit 0
          fi
          original="internal/gates/process_unix.go"
          backup_complete=0
          cleanup() {
            local failed=0
            if [[ "${backup_complete}" -eq 1 ]] && ! cp "${task}/process_unix.go" "${original}"; then
              failed=1
            fi
            if ! chmod -R u+w "${task}"; then
              failed=1
            fi
            if ! find "${task}" -depth -delete; then
              failed=1
            fi
            return "${failed}"
          }
          task="$(mktemp -d "${RUNNER_TEMP}/golib-finite-termination.XXXXXX")"
          trap 'status=$?; if ! cleanup; then status=1; fi; exit "${status}"' EXIT
          cp "${original}" "${task}/process_unix.go"
          backup_complete=1
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          export GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp"
          export GOWORK=off GOMAXPROCS=2
          go test -p=1 ./internal/gates \
            -run '^Test(ProcessExecutorStopsOverflowingOriginalProcessGroup|ProcessExecutorPreservesCancellationCause|HostedProcessTerminationWithoutStartedProcess)$' \
            -count=1 -timeout=30s
          grep -Fxq $'\t_ = syscall.Kill(-process.Process.Pid, syscall.SIGKILL)' "${original}"
          sed -i 's/syscall.Kill(-process.Process.Pid, syscall.SIGKILL)/syscall.Kill(+process.Process.Pid, syscall.SIGKILL)/' "${original}"
          set +e
          go test -p=1 ./internal/gates -run '^TestProcessExecutorStopsOverflowingOriginalProcessGroup$' \
            -count=1 -timeout=30s >"${task}/sign-result" 2>&1
          status=$?
          set -e
          test "${status}" -eq 1
          grep -Fq 'original-group helper reached its natural-exit marker' "${task}/sign-result"
          cp "${task}/process_unix.go" "${original}"
          grep -Fxq $'\tif process.Process == nil {' "${original}"
          sed -i 's/if process.Process == nil {/if process.Process != nil {/' "${original}"
          set +e
          go test -p=1 ./internal/gates -run '^TestHostedProcessTerminationWithoutStartedProcess$' \
            -count=1 -timeout=30s >"${task}/nil-result" 2>&1
          status=$?
          set -e
          test "${status}" -eq 1
          grep -Fq 'invalid memory address or nil pointer dereference' "${task}/nil-result"
          cp "${task}/process_unix.go" "${original}"
          git diff --exit-code -- "${original}"
      - name: Verify historical public tool identities when affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" &&
            git diff --quiet "${BASE_SHA}" HEAD -- internal/gates/runner.go \
              internal/gates/gitleaks_policy.go internal/gates/policy/secrets.toml \
              internal/gates/apidiff_history_policy_internal_test.go \
              internal/gates/apidiff_history_policy_hosted_test.go .github/workflows/ci.yml; then
            exit 0
          fi
          task="$(mktemp -d "${RUNNER_TEMP}/golib-apidiff-history.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            GOWORK=off GOTOOLCHAIN=local GOPROXY=https://proxy.golang.org \
            GOSUMDB=sum.golang.org GOMAXPROCS=2 \
            go test -p=1 -tags=scannerintegration ./internal/gates \
              -run '^TestHistoricalAPIDiffPolicyPinnedScannerHosted$' -count=1 -timeout=15m
      - name: Verify pinned gosec package selection when affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" &&
            git diff --quiet "${BASE_SHA}" HEAD -- internal/gates/gosec_packages.go \
              internal/gates/gosec_packages_internal_test.go internal/gates/gosec_packages_hosted_test.go \
              internal/gates/runner.go .github/workflows/ci.yml; then
            exit 0
          fi
          task="$(mktemp -d "${RUNNER_TEMP}/golib-gosec-selection.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            GOWORK=off GOTOOLCHAIN=local GOPROXY=https://proxy.golang.org \
            GOSUMDB=sum.golang.org GOMAXPROCS=2 \
            go test -p=1 -tags=scannerintegration ./internal/gates \
              -run '^TestGosecSelectedPackagesHosted$' -count=1 -timeout=15m
      - name: Run mutation verifier behavior when affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" &&
            git diff --quiet "${BASE_SHA}" HEAD -- internal/mutation go.mod go.sum .go-version; then
            exit 0
          fi
          task="$(mktemp -d "${RUNNER_TEMP}/golib-verifier-test.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            GOMAXPROCS=2 go test -p=1 -tags=verifierintegration ./internal/mutation \
              -run '^Test(HostedVerifierUnitFirstExecution|PatchedVerifierRenewsTimeoutForEachIntegrationPhase)$' \
              -count=1 -timeout=6m

      - name: Verify public metadata and fixture finding retention when affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          GOLIB_GITLEAKS_INTEGRATION: '1'
          GOENV: 'off'
          GOWORK: 'off'
          GOTOOLCHAIN: local
          GOMAXPROCS: '2'
          GOFLAGS: -p=1
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
          GOPRIVATE: ''
          GONOPROXY: ''
          GONOSUMDB: ''
        run: |
          set -euo pipefail
          if [[ -n "${BASE_SHA}" ]] && git cat-file -e "${BASE_SHA}^{commit}" &&
            git diff --quiet "${BASE_SHA}" HEAD -- internal/gates/runner.go \
              internal/gates/gitleaks_policy.go internal/gates/policy/secrets.toml \
              internal/gates/embedded_policy_internal_test.go \
              internal/gates/affected.go \
              internal/gates/gitleaks_sources.go internal/gates/secrets_changes.go \
              internal/gates/secrets_changes_internal_test.go \
              internal/gates/ethereum_trie_fixture_policy_internal_test.go \
              internal/gates/jsonapi_digest_policy_hosted_test.go \
              internal/gates/public_password_github_metadata_policy_internal_test.go \
              internal/gates/public_policy_source_history_internal_test.go \
              internal/gates/openapi_digest_policy_internal_test.go \
              internal/gates/identity_evidence_policy_internal_test.go \
              internal/gates/github_public_examples_policy_internal_test.go .github/workflows/ci.yml; then
            exit 0
          fi
          test "${GITHUB_ACTIONS}" = true
          task="$(mktemp -d "${RUNNER_TEMP}/golib-ethereum-fixture.XXXXXX")"
          trap 'chmod -R u+w "${task}"; find "${task}" -depth -delete; test ! -e "${task}"' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          export GOCACHE="${task}/cache" GOMODCACHE="${task}/mod"
          export GOTMPDIR="${task}/tmp" TMPDIR="${task}/tmp"
          test "$(go env GOVERSION)" = go1.27.3
          go test -p=1 ./internal/gates \
            -run '^(TestChangedSecretsPinnedScannerRetainsFindings|TestEthereumTrieFixturePolicyHosted|TestJSONAPIDecisionDigestPolicyHosted|TestOpenAPIDecisionDigestPolicyIntegration|TestIdentityEvidencePolicyPinnedScanner|TestGitHubPublicExamplesPolicyIntegration|TestPublicPasswordAndGitHubMetadataPinnedScanner|TestPublicPolicySourceHistoryPinnedScanner|TestEmbeddedGitleaksPolicyPinnedScanner)$' -count=1 -timeout=15m

  compatibility-consumer-scope:
    name: Compatibility consumer scope
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
      publication_required: ${{ steps.scope.outputs.publication_required }}
      files: ${{ steps.scope.outputs.files }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect compatibility-set publication and consumer changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-compatibility-scope.XXXXXX")"
          trap 'find "${task}" -depth -delete' EXIT
          publication_required=false
          git show "${BASE_SHA}:docs/ecosystem/compatibility-sets.json" >"${task}/base.json"
          if ! python3 tools/compatibility/generate.py check --offline >/dev/null 2>&1; then
            echo 'compatibility catalog local validation failed; run the offline check locally' >&2
            exit 1
          fi
          if jq -e --slurpfile base "${task}/base.json" '
            .sets as $current_sets |
            any($current_sets[];
              .publication_status == "published" and
              (. as $current | .set_id as $id |
                (($base[0].sets // []) |
                  map(select(.set_id == $id)) |
                  .[0]) != $current)) or
            any($base[0].sets[];
              .publication_status == "published" and
              (.set_id as $id |
                any($current_sets[];
                  .set_id == $id and .publication_status == "published") | not))
          ' docs/ecosystem/compatibility-sets.json >/dev/null 2>&1; then
            publication_required=true
          else
            classification_status=$?
            if test "${classification_status}" -ne 1; then
              echo 'compatibility catalog classification failed' >&2
              exit 1
            fi
          fi
          echo "publication_required=${publication_required}" >>"${GITHUB_OUTPUT}"
          PUBLICATION_REQUIRED="${publication_required}" python3 .github/scripts/select-compatibility-consumer.py

  compatibility-consumer:
    name: Compatibility consumer (${{ matrix.platform }})
    if: needs.compatibility-consumer-scope.outputs.required == 'true'
    needs: compatibility-consumer-scope
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - platform: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Resolve and test the public compatibility consumer
        env:
          SCENARIO_FILES: ${{ needs.compatibility-consumer-scope.outputs.files }}
          EXPECTED_GOOS: ${{ matrix.goos }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: bash .github/scripts/run-compatibility-consumer.sh

  milestone:
    name: Aggregate milestone
    if: >-
      always() && needs.quality.result == 'success' &&
      (needs.compatibility-consumer-scope.outputs.publication_required == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.ecosystem_milestone))
    needs: [quality, compatibility-consumer-scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run aggregate milestone checks
        run: make milestone-check

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 120 }}
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - *tooling-change-scope
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.scope.outputs.runtime == 'true'
        with:
          go-version-file: .go-version
          cache: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        if: steps.scope.outputs.runtime == 'true'
        with:
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.zst
          languages: go
          build-mode: manual
          queries: security-extended,security-and-quality
      - name: Build runtime source
        if: steps.scope.outputs.runtime == 'true'
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-codeql.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" GOWORK=off go build ./...
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        if: steps.scope.outputs.runtime == 'true'

  release-rehearsal:
    name: Release rehearsal
    if: github.event_name == 'workflow_dispatch' && (inputs.release_rehearsal || inputs.release_module != '')
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate release inputs
        env:
          RELEASE_MODULE: ${{ inputs.release_module }}
          RELEASE_REHEARSAL: ${{ inputs.release_rehearsal }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_MODULE}" && "${RELEASE_REHEARSAL}" != true ]]; then
            echo 'release_module requires release_rehearsal: true' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run pre-tag release dry-run
        env:
          RELEASE_MODULE: ${{ inputs.release_module }}
          GOMAXPROCS: '2'
          GOFLAGS: -p=1
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-release-rehearsal.XXXXXX")"
          observer=""
          cleanup() {
            result="${1:-$?}"
            trap - EXIT
            if [[ -n "${observer}" ]] && jobs -pr | grep -qx "${observer}"; then
              kill "${observer}" 2>/dev/null || true
            fi
            if [[ -n "${observer}" ]]; then
              wait "${observer}" 2>/dev/null || true
            fi
            chmod -R u+w "${task}" 2>/dev/null || true
            find "${task}" -depth -delete || { [[ "${result}" -ne 0 ]] || result=1; }
            exit "${result}"
          }
          trap 'cleanup' EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          python3 -u .github/scripts/observe-runner.py "$$" &
          observer=$!
          result=0
          if [[ -n "${RELEASE_MODULE}" ]]; then
            GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
              go run ./cmd/golib release dry-run --module "${RELEASE_MODULE}" || result=$?
          else
            GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
              go run ./cmd/golib release dry-run || result=$?
          fi
          printf '{"event":"release-child-exit","exit_code":%d}\n' "${result}"
          cleanup "${result}"
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-verification
          path: .verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  native-cli-diagnostic:
    name: Native CLI diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.native_cli_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Observe actual CLI mutant execution and rollback
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -p=1
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-native-cli-diagnostic.XXXXXX")"
          observer=""
          cleanup() {
            if [[ -n "${observer}" ]] && jobs -pr | grep -qx "${observer}"; then
              kill "${observer}" 2>/dev/null || true
            fi
            if [[ -n "${observer}" ]]; then
              wait "${observer}" 2>/dev/null || true
            fi
            chmod -R u+w "${task}" && find "${task}" -depth -delete
          }
          trap 'status=$?; if ! cleanup; then status=1; fi; exit "${status}"' EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          export GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" GOWORK=off
          export GOLIB_NATIVE_CLI_DIAGNOSTIC=1
          python3 -u .github/scripts/observe-runner.py "$$" &
          observer=$!
          go test -p 1 ./internal/mutation -run '^TestHostedNativeCLISingleMutationDiagnostic$' -count=1 -timeout=27m -v

  required:
    name: Required
    if: always()
    needs: [dependency-review, quality, compatibility-consumer-scope, compatibility-consumer, milestone, codeql, release-rehearsal, native-cli-diagnostic]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          EVENT_NAME: ${{ github.event_name }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_SCOPE_RESULT: ${{ needs.compatibility-consumer-scope.result }}
          COMPATIBILITY_CONSUMER_REQUIRED: ${{ needs.compatibility-consumer-scope.outputs.required }}
          PUBLICATION_REQUIRED: ${{ needs.compatibility-consumer-scope.outputs.publication_required }}
          COMPATIBILITY_CONSUMER_RESULT: ${{ needs.compatibility-consumer.result }}
          MILESTONE_RESULT: ${{ needs.milestone.result }}
          MILESTONE_SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.ecosystem_milestone }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          RELEASE_REHEARSAL_RESULT: ${{ needs.release-rehearsal.result }}
          RELEASE_REHEARSAL_SELECTED: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_rehearsal || inputs.release_module != '') }}
          NATIVE_CLI_DIAGNOSTIC_RESULT: ${{ needs.native-cli-diagnostic.result }}
          NATIVE_CLI_DIAGNOSTIC_SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.native_cli_diagnostic }}
        run: |
          set -euo pipefail
          test "${QUALITY_RESULT}" = success
          test "${CODEQL_RESULT}" = success
          milestone_required=false
          case "${EVENT_NAME}" in
            pull_request|push)
              test "${COMPATIBILITY_SCOPE_RESULT}" = success
              case "${COMPATIBILITY_CONSUMER_REQUIRED}" in
                true) test "${COMPATIBILITY_CONSUMER_RESULT}" = success ;;
                false) test "${COMPATIBILITY_CONSUMER_RESULT}" = skipped ;;
                *) exit 1 ;;
              esac
              case "${PUBLICATION_REQUIRED}" in
                true)
                  test "${COMPATIBILITY_CONSUMER_REQUIRED}" = true
                  milestone_required=true ;;
                false) ;;
                *) exit 1 ;;
              esac
              ;;
            schedule|workflow_dispatch)
              test "${COMPATIBILITY_SCOPE_RESULT}" = skipped
              test "${COMPATIBILITY_CONSUMER_RESULT}" = skipped
              ;;
            *) exit 1 ;;
          esac
          if test "${EVENT_NAME}" = pull_request; then
            test "${DEPENDENCY_REVIEW_RESULT}" = success
          else
            test "${DEPENDENCY_REVIEW_RESULT}" = skipped
          fi
          case "${MILESTONE_SELECTED}" in
            true) milestone_required=true ;;
            false) ;;
            *) exit 1 ;;
          esac
          if test "${milestone_required}" = true; then
            test "${MILESTONE_RESULT}" = success
          else
            test "${MILESTONE_RESULT}" = skipped
          fi
          case "${RELEASE_REHEARSAL_SELECTED}" in
            true) test "${RELEASE_REHEARSAL_RESULT}" = success ;;
            false) test "${RELEASE_REHEARSAL_RESULT}" = skipped ;;
            *) exit 1 ;;
          esac
          case "${NATIVE_CLI_DIAGNOSTIC_SELECTED}" in
            true) test "${NATIVE_CLI_DIAGNOSTIC_RESULT}" = success ;;
            false) test "${NATIVE_CLI_DIAGNOSTIC_RESULT}" = skipped ;;
            *) exit 1 ;;
          esac
