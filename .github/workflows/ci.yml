name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      release_rehearsal:
        description: Run the complete pre-tag release dry-run
        required: false
        type: boolean
        default: false
      release_module:
        description: Rehearse exactly one module directory; blank rehearses every module
        required: false
        type: string
        default: ''
      schema_v3_linux_probe:
        description: Run the bounded schema-v3 Linux host capability probe
        required: false
        type: boolean
        default: false
      schema_v3_expected_sha:
        description: Exact 40-hex source and workflow commit required when the schema-v3 probe is enabled
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: go-library-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.4.1'
          package-manager-cache: false
      - name: Build source CLI
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-bootstrap.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/golib" ./cmd/golib
      - name: Verify clean-room forward oracle
        run: python3 tools/forward-oracle/verify.py
      - name: Verify contract-review forward oracle
        run: python3 tools/forward-oracle/verify_contract_review.py
      - name: Verify contract-freeze forward oracle
        run: python3 tools/forward-oracle/verify_contract_freeze.py
      - name: Inventory provenance inputs
        run: python3 tools/provenance/check.py
      - name: Run repository contract
        run: make ci
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tooling-verification
          path: .verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          languages: go
          queries: security-extended,security-and-quality
      - run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-codeql.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" go build ./...
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4

  cohesion-linux-capability-probe:
    name: Cohesion Linux capability probe / ${{ matrix.goarch }}
    if: github.event_name == 'workflow_dispatch' && inputs.schema_v3_linux_probe == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.schema_v3_expected_sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - name: Run bounded Linux capability probe
        env:
          EXPECTED_ARCH: ${{ matrix.goarch }}
          EXPECTED_SHA: ${{ inputs.schema_v3_expected_sha }}
          HEAD_SHA: ${{ github.sha }}
          HEAD_REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_EVENT: ${{ github.event_name }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${HEAD_SHA}" = "${EXPECTED_SHA}"
          test "${WORKFLOW_SHA}" = "${EXPECTED_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test "$(go env GOARCH)" = "${EXPECTED_ARCH}"
          : "${ImageVersion:?runner image version unavailable}"
          task="$(mktemp -d "${RUNNER_TEMP}/golib-linux-probe.XXXXXX")"
          log=".verification/cohesion/linux-probe-${EXPECTED_ARCH}.log"
          mkdir -p .verification/cohesion
          unit="golib-schema-v3-${GITHUB_RUN_ID}-${RUN_ATTEMPT}-${EXPECTED_ARCH}.service"
          profile_name="golib-schema-v3-${GITHUB_RUN_ID}-${RUN_ATTEMPT}-${EXPECTED_ARCH}"
          profile_path="${task}/${profile_name}.apparmor"
          profile_owned=false
          unit_cgroup=''
          cleanup_unit() {
            sudo -n systemctl stop "${unit}" >/dev/null 2>&1 || true
            sudo -n systemctl reset-failed "${unit}" >/dev/null 2>&1 || true
            for _ in $(seq 1 100); do
              load_state="$(sudo -n systemctl show --property=LoadState --value "${unit}" 2>/dev/null || true)"
              if [[ "${load_state}" == 'not-found' ]] && { [[ -z "${unit_cgroup}" ]] || [[ ! -e "/sys/fs/cgroup${unit_cgroup}" ]]; }; then
                return 0
              fi
              sleep 0.1
            done
            return 1
          }
          cleanup_profile() {
            sudo -n test -r /sys/kernel/security/apparmor/profiles || return 1
            if [[ "${profile_owned}" == true ]] && sudo -n grep -Eq "^${profile_name} \\(.*\\)$" /sys/kernel/security/apparmor/profiles; then
              sudo -n apparmor_parser -R "${profile_path}" || return 1
            fi
            if sudo -n grep -Eq "^${profile_name} \\(.*\\)$" /sys/kernel/security/apparmor/profiles; then
              return 1
            fi
            profile_owned=false
          }
          cleanup() {
            status=$?
            trap - EXIT
            cleanup_status=0
            cleanup_unit || cleanup_status=$?
            cleanup_profile || cleanup_status=$?
            chmod -R u+w "${task}" 2>/dev/null || true
            find "${task}" -depth -delete || cleanup_status=$?
            if [[ ! -e "${task}" ]]; then
              printf 'task_cleanup=absent\n' >> "${log}"
            else
              cleanup_status=1
            fi
            if (( status == 0 && cleanup_status != 0 )); then
              status=${cleanup_status}
            fi
            exit "${status}"
          }
          trap cleanup EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          printf 'repository=%s\nrun_id=%s\nrun_attempt=%s\nevent=%s\nworkflow_ref=%s\nworkflow_sha=%s\nhead_ref=%s\nhead_sha=%s\nexpected_sha=%s\nrunner_os=%s\nrunner_arch=%s\nrunner_image_version=%s\narchitecture=%s\n' \
            "${REPOSITORY}" "${GITHUB_RUN_ID}" "${RUN_ATTEMPT}" "${RUN_EVENT}" "${WORKFLOW_REF}" "${WORKFLOW_SHA}" "${HEAD_REF}" "${HEAD_SHA}" "${EXPECTED_SHA}" "${RUNNER_OS_VALUE}" "${RUNNER_ARCH_VALUE}" "${ImageVersion}" "${EXPECTED_ARCH}" > "${log}"
          COHESION_PROBE_FOCUSED=lease CGO_ENABLED=1 GOOS=linux GOARCH="${EXPECTED_ARCH}" \
            GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            GOENV=off GOWORK=off \
            go test -race -trimpath -buildvcs=false -run '^TestProbeLeaseCompletesBreak$' -count=1 \
              ./cmd/cohesion-linux-capability-probe | tee -a "${log}"
          CGO_ENABLED=0 GOOS=linux GOARCH="${EXPECTED_ARCH}" \
            GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            GOENV=off GOWORK=off \
            go test -c -trimpath -buildvcs=false -o "${task}/probe" ./cmd/cohesion-linux-capability-probe
          file "${task}/probe" | tee -a "${log}"
          if readelf --program-headers "${task}/probe" | grep -q INTERP; then
            printf '%s\n' 'probe executable unexpectedly has an interpreter' >&2
            exit 1
          fi
          COHESION_PROBE_FOCUSED=lease "${task}/probe" -test.run '^TestProbeLeaseCompletesBreak$' -test.v >> "${log}" 2>&1
          sudo -n test -r /sys/kernel/security/apparmor/profiles
          if sudo -n grep -Eq "^${profile_name} \\(.*\\)$" /sys/kernel/security/apparmor/profiles; then
            printf '%s\n' "AppArmor profile already exists: ${profile_name}" >&2
            exit 1
          fi
          install -m 0600 /dev/null "${profile_path}"
          printf 'abi <abi/4.0>,\n\nprofile %s "%s" flags=(unconfined) {\n  userns,\n}\n' \
            "${profile_name}" "${task}/probe" > "${profile_path}"
          profile_owned=true
          sudo -n apparmor_parser -r "${profile_path}"
          sudo -n grep -Eq "^${profile_name} \\(unconfined\\)$" /sys/kernel/security/apparmor/profiles
          runner_uid="$(id -u)"
          runner_gid="$(id -g)"
          [[ "${runner_uid}" != '0' && "${runner_uid}" != '65534' ]]
          [[ "${runner_gid}" != '65534' ]]
          sudo -n systemd-run --quiet --no-block --service-type=exec \
            --unit="${unit}" \
            --property=Delegate=yes \
            --property=DelegateSubgroup=golib-supervisor \
            --property=RemainAfterExit=yes \
            --property="User=${runner_uid}" \
            --property="Group=${runner_gid}" \
            --property=AmbientCapabilities=CAP_SETGID \
            --property="CapabilityBoundingSet=CAP_SETGID CAP_SETPCAP CAP_NET_ADMIN CAP_SYS_ADMIN" \
            --property="AppArmorProfile=${profile_name}" \
            --property="StandardOutput=append:${GITHUB_WORKSPACE}/${log}" \
            --property="StandardError=append:${GITHUB_WORKSPACE}/${log}" \
            "${task}/probe" delegated-launcher "${runner_uid}" "${runner_gid}" "${profile_name}"
          for _ in $(seq 1 100); do
            unit_cgroup="$(sudo -n systemctl show --property=ControlGroup --value "${unit}")"
            [[ -n "${unit_cgroup}" && -d "/sys/fs/cgroup${unit_cgroup}" ]] && break
            sleep 0.1
          done
          [[ "${unit_cgroup}" == */"${unit}" ]]
          delegated_root="/sys/fs/cgroup${unit_cgroup}"
          [[ -d "${delegated_root}" ]]
          printf 'delegated_unit=%s\ndelegated_cgroup=%s\n' "${unit}" "${unit_cgroup}" >> "${log}"
          for delegated_path in "${delegated_root}" "${delegated_root}/cgroup.procs" "${delegated_root}/cgroup.threads" "${delegated_root}/cgroup.subtree_control"; do
            [[ "$(stat -c '%u:%g' "${delegated_path}")" == "${runner_uid}:${runner_gid}" ]]
            [[ -w "${delegated_path}" ]]
          done
          for _ in $(seq 1 1200); do
            active_state="$(sudo -n systemctl show --property=ActiveState --value "${unit}")"
            sub_state="$(sudo -n systemctl show --property=SubState --value "${unit}")"
            [[ "${active_state}/${sub_state}" == 'active/exited' || "${active_state}" == 'failed' ]] && break
            sleep 0.1
          done
          active_state="$(sudo -n systemctl show --property=ActiveState --value "${unit}")"
          sub_state="$(sudo -n systemctl show --property=SubState --value "${unit}")"
          result="$(sudo -n systemctl show --property=Result --value "${unit}")"
          main_status="$(sudo -n systemctl show --property=ExecMainStatus --value "${unit}")"
          cleanup_unit
          printf 'delegated_cleanup=absent\n' >> "${log}"
          cleanup_profile
          printf 'apparmor_cleanup=absent\n' >> "${log}"
          [[ "${active_state}/${sub_state}" == 'active/exited' ]]
          [[ "${result}" == 'success' ]]
          [[ "${main_status}" == '0' ]]
          cat "${log}"
      - name: Upload capability evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cohesion-linux-capability-${{ matrix.goarch }}-${{ inputs.schema_v3_expected_sha }}
          path: .verification/cohesion/linux-probe-${{ matrix.goarch }}.log
          if-no-files-found: error
          retention-days: 30

  release-rehearsal:
    name: Release rehearsal
    if: github.event_name == 'workflow_dispatch' && (inputs.release_rehearsal || inputs.release_module != '')
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Validate release inputs
        env:
          RELEASE_MODULE: ${{ inputs.release_module }}
          RELEASE_REHEARSAL: ${{ inputs.release_rehearsal }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_MODULE}" && "${RELEASE_REHEARSAL}" != true ]]; then
            echo 'release_module requires release_rehearsal: true' >&2
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.4.1'
          package-manager-cache: false
      - name: Run pre-tag release dry-run
        env:
          RELEASE_MODULE: ${{ inputs.release_module }}
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-release-rehearsal.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          if [[ -n "${RELEASE_MODULE}" ]]; then
            GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
              go run ./cmd/golib release dry-run --module "${RELEASE_MODULE}"
          else
            GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
              go run ./cmd/golib release dry-run
          fi
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-rehearsal-verification
          path: .verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  required:
    name: Required
    if: always()
    needs: [dependency-review, quality, codeql, cohesion-linux-capability-probe, release-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          COHESION_LINUX_CAPABILITY_PROBE_RESULT: ${{ needs.cohesion-linux-capability-probe.result }}
          RELEASE_REHEARSAL_RESULT: ${{ needs.release-rehearsal.result }}
        run: |
          test "${QUALITY_RESULT}" = success
          test "${CODEQL_RESULT}" = success
          test "${COHESION_LINUX_CAPABILITY_PROBE_RESULT}" = success -o "${COHESION_LINUX_CAPABILITY_PROBE_RESULT}" = skipped
          test "${DEPENDENCY_REVIEW_RESULT}" = success -o "${DEPENDENCY_REVIEW_RESULT}" = skipped
          test "${RELEASE_REHEARSAL_RESULT}" = success -o "${RELEASE_REHEARSAL_RESULT}" = skipped
