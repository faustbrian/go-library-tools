name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      gosec_diagnostic:
        description: Run only the bounded standalone gosec diagnostic
        required: false
        type: boolean
        default: false
      release_rehearsal:
        description: Run the complete pre-tag release dry-run
        required: false
        type: boolean
        default: false
      release_module:
        description: Rehearse exactly one module directory; blank rehearses every module
        required: false
        type: string
        default: ''
permissions:
  contents: read

concurrency:
  group: go-library-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gosec-diagnostic:
    name: Bounded gosec diagnostic
    if: github.event_name == 'workflow_dispatch' && inputs.gosec_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TASK_NAME: golib-gosec-${{ github.run_id }}-${{ github.run_attempt }}
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 71862edbff6d1cb69e250164ffac0a344eba8e81
          path: producer
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.0'
          cache: false
      - name: Initialize private task resources
        run: |
          set -euo pipefail
          umask 077
          TASK_ROOT="${RUNNER_TEMP}/${TASK_NAME}"
          mkdir -p "${TASK_ROOT}/cache" "${TASK_ROOT}/mod" "${TASK_ROOT}/tmp" "${TASK_ROOT}/bin"
          printf 'TASK_ROOT=%s\n' "${TASK_ROOT}" >>"${GITHUB_ENV}"
          printf 'GOCACHE=%s/cache\nGOMODCACHE=%s/mod\nGOTMPDIR=%s/tmp\nGOBIN=%s/bin\nTMPDIR=%s/tmp\n' \
            "${TASK_ROOT}" "${TASK_ROOT}" "${TASK_ROOT}" "${TASK_ROOT}" "${TASK_ROOT}" >>"${GITHUB_ENV}"
      - name: Report only bounded issue identities and counts
        working-directory: producer
        run: |
          set -euo pipefail
          umask 077
          if ! go install -p 1 github.com/securego/gosec/v2/cmd/gosec@v2.29.0 \
            >"${TASK_ROOT}/build.log" 2>&1; then
            echo 'gosec diagnostic build failed; private output suppressed'
            exit 1
          fi
          set +e
          (ulimit -f 16384; timeout 10m "${GOBIN}/gosec" \
            -nosec-require-rules -nosec-require-justification \
            -fmt=json -out="${TASK_ROOT}/report.json" ./...) \
            >"${TASK_ROOT}/scanner.log" 2>&1
          scanner_status=$?
          set -e
          if [[ ! -f "${TASK_ROOT}/report.json" ]] || \
             ! jq -e '((.Issues // []) | type == "array") and
               ((.["Golang errors"] // {}) | type == "object") and
               all((.Issues // [])[];
                 (.rule_id | test("^G[0-9]{3}$")) and
                 (.file | type == "string") and
                 (.line | test("^[1-9][0-9]{0,6}(-[1-9][0-9]{0,6})?$")))' \
               "${TASK_ROOT}/report.json" > /dev/null 2>&1; then
            echo 'gosec diagnostic report unavailable or invalid; private output suppressed'
            exit 1
          fi
          issue_count=$(jq '(.Issues // []) | length' "${TASK_ROOT}/report.json")
          load_error_count=$(jq '(.["Golang errors"] // {}) | [.[] | length] | add // 0' "${TASK_ROOT}/report.json")
          printf 'gosec-diagnostic status=%d issues=%d load-errors=%d\n' \
            "${scanner_status}" "${issue_count}" "${load_error_count}"
          while IFS=$'\t' read -r file rule line; do
            relative=${file#"${PWD}/"}
            identity=$(printf '%s' "${relative}" | sha256sum)
            printf 'gosec-location %s %s %s\n' "${identity%% *}" "${rule}" "${line}"
          done < <(jq -r '(.Issues // [])[0:32][] | [.file, .rule_id, .line] | @tsv' "${TASK_ROOT}/report.json")
          if (( issue_count > 32 )); then
            echo 'additional gosec locations omitted'
          fi
          if (( scanner_status != 0 )); then
            exit "${scanner_status}"
          fi
          test "${issue_count}" -eq 0
          test "${load_error_count}" -eq 0
      - name: Remove private reports and task resources
        if: always()
        run: |
          set -euo pipefail
          for owned in "${RUNNER_TEMP}/${TASK_NAME}" "${GITHUB_WORKSPACE}/producer"; do
            if [[ -d "${owned}" ]]; then
              find "${owned}" -type d -exec chmod u+w {} +
              find "${owned}" -depth -delete
            fi
          done

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: true
          vulnerability-check: true
          warn-only: false

  quality:
    name: Quality
    if: github.event_name != 'workflow_dispatch' || !inputs.gosec_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run fast local CI
        run: make local-ci
      - name: Run mutation verifier behavior when affected
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "${BASE_SHA}" HEAD -- internal/mutation; then
            exit 0
          fi
          task="$(mktemp -d "${RUNNER_TEMP}/golib-verifier-test.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            go test -tags=verifierintegration ./internal/mutation \
              -run '^TestPatchedVerifierRenewsTimeoutForEachIntegrationPhase$' -count=1 -timeout=2m

  compatibility-consumer-scope:
    name: Compatibility consumer scope
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
      publication_required: ${{ steps.scope.outputs.publication_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect compatibility-set publication and consumer changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-compatibility-scope.XXXXXX")"
          trap 'find "${task}" -depth -delete' EXIT
          publication_required=false
          git show "${BASE_SHA}:docs/ecosystem/compatibility-sets.json" >"${task}/base.json"
          if jq -e --slurpfile base "${task}/base.json" '
            any(.sets[];
              .publication_status == "published" and
              (.set_id as $id |
                (($base[0].sets // []) |
                  map(select(.set_id == $id)) |
                  (.[0].publication_status // "absent")) != "published"))
          ' docs/ecosystem/compatibility-sets.json >/dev/null; then
            publication_required=true
          fi
          echo "publication_required=${publication_required}" >>"${GITHUB_OUTPUT}"
          if [[ "${publication_required}" == true ]] ||
            ! git diff --quiet "${BASE_SHA}" HEAD -- \
              release/compatibility-consumer/go.mod \
              release/compatibility-consumer/go.sum \
              release/compatibility-consumer/consumer_test.go \
              release/compatibility-consumer/composition_test.go \
              release/compatibility-consumer/workflow_composition_test.go \
              release/compatibility-consumer/selection.json \
              tools/compatibility/generate.py; then
            echo 'required=true' >>"${GITHUB_OUTPUT}"
          else
            echo 'required=false' >>"${GITHUB_OUTPUT}"
          fi

  compatibility-consumer:
    name: Compatibility consumer (${{ matrix.platform }})
    if: needs.compatibility-consumer-scope.outputs.required == 'true'
    needs: compatibility-consumer-scope
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - platform: linux-amd64
            runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Resolve and test the public compatibility consumer
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-compatibility-consumer.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/consumer" "${task}/mod" "${task}/tmp"
          cp release/compatibility-consumer/go.mod \
            release/compatibility-consumer/consumer_test.go \
            release/compatibility-consumer/composition_test.go \
            release/compatibility-consumer/workflow_composition_test.go "${task}/consumer/"
          cd "${task}/consumer"
          export GOCACHE="${task}/cache"
          export GOMODCACHE="${task}/mod"
          export GOTMPDIR="${task}/tmp"
          export GOPROXY='https://proxy.golang.org'
          export GOSUMDB='sum.golang.org'
          export GOWORK='off'
          test "$(go env GOVERSION)" = 'go1.27.0'
          test "$(go env GOOS)/$(go env GOARCH)" = '${{ matrix.goos }}/${{ matrix.goarch }}'
          # Keep TLS and SumDB verification while avoiding failed HTTP/2 streams.
          GODEBUG=http2client=0 go mod tidy
          go test -mod=readonly -count=1 ./...

  milestone:
    name: Aggregate milestone
    if: >-
      always() && needs.quality.result == 'success' &&
      (github.event_name != 'pull_request' ||
      needs.compatibility-consumer-scope.outputs.publication_required == 'true')
    needs: [quality, compatibility-consumer-scope]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Run aggregate milestone checks
        run: make milestone-check

  codeql:
    name: CodeQL
    if: github.event_name != 'workflow_dispatch' || !inputs.gosec_diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: go
          queries: security-extended,security-and-quality
      - run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-codeql.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" go build ./...
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4

  release-rehearsal:
    name: Release rehearsal
    if: github.event_name == 'workflow_dispatch' && (inputs.release_rehearsal || inputs.release_module != '')
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Validate release inputs
        env:
          RELEASE_MODULE: ${{ inputs.release_module }}
          RELEASE_REHEARSAL: ${{ inputs.release_rehearsal }}
        run: |
          set -euo pipefail
          if [[ -n "${RELEASE_MODULE}" && "${RELEASE_REHEARSAL}" != true ]]; then
            echo 'release_module requires release_rehearsal: true' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.4.1'
          package-manager-cache: false
      - name: Run pre-tag release dry-run
        env:
          RELEASE_MODULE: ${{ inputs.release_module }}
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-release-rehearsal.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          if [[ -n "${RELEASE_MODULE}" ]]; then
            GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
              go run ./cmd/golib release dry-run --module "${RELEASE_MODULE}"
          else
            GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
              go run ./cmd/golib release dry-run
          fi
      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-verification
          path: .verification
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  required:
    name: Required
    if: always()
    needs: [dependency-review, quality, compatibility-consumer-scope, compatibility-consumer, milestone, codeql, release-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          COMPATIBILITY_SCOPE_RESULT: ${{ needs.compatibility-consumer-scope.result }}
          COMPATIBILITY_CONSUMER_RESULT: ${{ needs.compatibility-consumer.result }}
          MILESTONE_RESULT: ${{ needs.milestone.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          RELEASE_REHEARSAL_RESULT: ${{ needs.release-rehearsal.result }}
        run: |
          test "${QUALITY_RESULT}" = success
          test "${COMPATIBILITY_SCOPE_RESULT}" = success -o "${COMPATIBILITY_SCOPE_RESULT}" = skipped
          test "${COMPATIBILITY_CONSUMER_RESULT}" = success -o "${COMPATIBILITY_CONSUMER_RESULT}" = skipped
          test "${MILESTONE_RESULT}" = success -o "${MILESTONE_RESULT}" = skipped
          test "${CODEQL_RESULT}" = success
          test "${DEPENDENCY_REVIEW_RESULT}" = success -o "${DEPENDENCY_REVIEW_RESULT}" = skipped
          test "${RELEASE_REHEARSAL_RESULT}" = success -o "${RELEASE_REHEARSAL_RESULT}" = skipped
