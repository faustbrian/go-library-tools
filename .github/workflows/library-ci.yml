name: Go library CI

on:
  workflow_call:
    inputs:
      tooling_sha:
        description: Immutable go-library-tools commit used by this workflow reference
        required: true
        type: string
      source_bootstrap:
        description: Use this exact tooling checkout as an immutable development verifier for the selected proportional checks
        required: false
        default: false
        type: boolean
      release_dry_run:
        description: Add release security and candidate packaging to the standard contract
        required: false
        default: false
        type: boolean
      public_dependencies:
        description: Resolve external Go dependencies only through the public proxy and checksum database
        required: false
        default: false
        type: boolean
      release_module:
        description: Rehearse exactly one module directory; blank rehearses every releasable module
        required: false
        default: ''
        type: string
      source_documentation:
        description: Explicit source-docs mode (inventory or check); blank preserves existing released-tooling callers
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: golib-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          license-check: true
          vulnerability-check: true
          warn-only: false

  prepare:
    name: Select modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.modules.outputs.matrix }}
      deno: ${{ steps.modules.outputs.deno }}
      zsh: ${{ steps.modules.outputs.zsh }}
      runtime: ${{ steps.scope.outputs.runtime }}
      source_artifact_id: ${{ steps.source-artifact.outputs.artifact-id }}
      source_binary_sha256: ${{ steps.source-binary.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: scope
        name: Select proportional assurance tier
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request|push|schedule|workflow_dispatch) ;;
            *) echo 'unsupported change event' >&2; exit 1 ;;
          esac
          if [[ "${EVENT_NAME}" == pull_request && "${RELEASE_DRY_RUN}" == true ]]; then
            echo 'release rehearsal is not a pull-request check; dispatch it explicitly after integration' >&2
            exit 1
          fi
          task="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/golib-change-scope.XXXXXX")"
          trap 'find "${task}" -depth -delete' EXIT
          reusable_pin_only() {
            local path="$1"
            local line payload direction
            local old_uses='' new_uses='' old_input='' new_input=''
            local old_uses_count=0 new_uses_count=0 old_input_count=0 new_input_count=0
            local uses_pattern='^[[:space:]]*uses:[[:space:]]+faustbrian/go-library-tools/\.github/workflows/library-ci\.yml@([0-9a-f]{40})([[:space:]]+#[[:space:]]*v[0-9]+\.[0-9]+\.[0-9]+([[:space:]]+[^[:cntrl:]]*)?)?[[:space:]]*$'
            local input_pattern='^[[:space:]]*tooling_sha:[[:space:]]+([0-9a-f]{40})[[:space:]]*$'
            git diff --no-ext-diff --unified=0 "${BASE_SHA}" HEAD -- "${path}" >"${task}/pin.diff" || return 1
            while IFS= read -r line; do
              case "${line}" in
                ---*|+++*|@@*) continue ;;
                +*|-*)
                  direction="${line:0:1}"
                  payload="${line:1}"
                  if [[ "${payload}" =~ ${uses_pattern} ]]; then
                    if [[ "${direction}" == + ]]; then
                      new_uses="${BASH_REMATCH[1]}"
                      ((new_uses_count += 1))
                    else
                      old_uses="${BASH_REMATCH[1]}"
                      ((old_uses_count += 1))
                    fi
                    continue
                  fi
                  if [[ "${payload}" =~ ${input_pattern} ]]; then
                    if [[ "${direction}" == + ]]; then
                      new_input="${BASH_REMATCH[1]}"
                      ((new_input_count += 1))
                    else
                      old_input="${BASH_REMATCH[1]}"
                      ((old_input_count += 1))
                    fi
                    continue
                  fi
                  return 1
                  ;;
              esac
            done <"${task}/pin.diff"
            [[ "${old_uses_count}" -eq 1 && "${new_uses_count}" -eq 1 &&
              "${old_input_count}" -eq 1 && "${new_input_count}" -eq 1 &&
              "${old_uses}" == "${old_input}" && "${new_uses}" == "${new_input}" ]]
          }
          runtime=true
          if [[ ( "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == push ) && "${RELEASE_DRY_RUN}" != true ]]; then
            [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'change classification requires an immutable base commit' >&2; exit 1; }
            git cat-file -e "${BASE_SHA}^{commit}"
            git diff --no-ext-diff --no-textconv --no-renames --raw --no-abbrev -z "${BASE_SHA}" HEAD -- >"${task}/paths"
            [[ "$(wc -c <"${task}/paths")" -le 1048576 ]] || { echo 'changed path budget exceeded' >&2; exit 1; }
            runtime=false
            changed=false
            while IFS= read -r -d '' change; do
              IFS= read -r -d '' path || { echo 'incomplete changed path record' >&2; exit 1; }
              changed=true
              case "${change}" in
                ':100644 100644 '*|':000000 100644 '*|':100644 000000 '*) ;;
                *) runtime=true; break ;;
              esac
              case "${path}" in
                *.md|LICENSE|LICENSE.txt|LICENSE.rst|NOTICE|NOTICE.txt|NOTICE.rst) ;;
                .github/workflows/ci.yml)
                  reusable_pin_only "${path}" || { runtime=true; break; }
                  ;;
                *) runtime=true; break ;;
              esac
            done <"${task}/paths"
            [[ "${changed}" == true ]] || runtime=true
          fi
          echo "runtime=${runtime}" >>"${GITHUB_OUTPUT}"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - name: Check immutable tooling identity
        env:
          TOOLING_SHA: ${{ inputs.tooling_sha }}
        run: |
          set -euo pipefail
          [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: ${{ inputs.tooling_sha }}
          path: .golib-tooling
          persist-credentials: false
      - uses: faustbrian/go-library-tools/.github/actions/setup-golib@e8c0c51cc517dfede5475858bb417f0e7a21f39d
        if: inputs.source_bootstrap != true
      - id: source-setup
        uses: faustbrian/go-library-tools/.github/actions/setup-golib@e8c0c51cc517dfede5475858bb417f0e7a21f39d
        if: inputs.source_bootstrap == true
        with:
          source_bootstrap: 'true'
          tooling_sha: ${{ inputs.tooling_sha }}
      - id: source-binary
        name: Bind source verifier binary
        if: inputs.source_bootstrap == true
        run: |
          set -euo pipefail
          root="${GOLIB_SOURCE_INSTALL_ROOT}"
          case "${root}" in
            "${RUNNER_TEMP}"/golib-source-install.*/*) echo 'unexpected source installation' >&2; exit 1 ;;
            "${RUNNER_TEMP}"/golib-source-install.*) ;;
            *) echo 'unexpected source installation' >&2; exit 1 ;;
          esac
          [[ ! -L "${root}" && ! -L "${root}/bin" && -f "${root}/bin/golib" && ! -L "${root}/bin/golib" ]]
          size="$(wc -c <"${root}/bin/golib" | tr -d ' ')"
          [[ "${size}" -gt 0 && "${size}" -le 67108864 ]] || { echo 'source verifier exceeds binary budget' >&2; exit 1; }
          sha256="$(shasum -a 256 "${root}/bin/golib" | cut -d ' ' -f 1)"
          {
            echo "sha256=${sha256}"
            echo "path=${root}/bin/golib"
            echo "name=$(basename "${root}")"
          } >>"${GITHUB_OUTPUT}"
      - id: source-artifact
        name: Share same-run source verifier
        if: inputs.source_bootstrap == true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.source-binary.outputs.name }}
          path: ${{ steps.source-binary.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Select public dependency authority
        if: inputs.public_dependencies == true
        run: |
          set -euo pipefail
          printf '%s\n' 'GOPROXY=https://proxy.golang.org' 'GOSUMDB=sum.golang.org' \
            'GOPRIVATE=' 'GONOPROXY=' 'GONOSUMDB=' >>"${GITHUB_ENV}"
      - id: modules
        name: Build module matrix
        env:
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run }}
          RELEASE_MODULE: ${{ inputs.release_module }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          RUNTIME: ${{ steps.scope.outputs.runtime }}
        run: |
          set -euo pipefail
          inventory="$(golib inventory --json)"
          configuration="$(golib config show --json)"
          release_module_capable=false
          golib_help="$(golib --help)"
          if [[ "${RELEASE_DRY_RUN}" != true && "${RUNTIME:-}" == true && ( "${EVENT_NAME:-}" == pull_request || "${EVENT_NAME:-}" == push ) ]]; then
            if ! grep -Fq 'golib inventory --json --base-sha <commit>' <<<"${golib_help}"; then
              echo 'this workflow requires affected inventory; select a qualified capable release or explicit immutable source_bootstrap' >&2
              exit 1
            fi
            inventory="$(golib inventory --json --base-sha "${BASE_SHA}")"
          fi
          if grep -Fq 'golib release dry-run [--all|--module <directory>]' <<<"${golib_help}"; then
            release_module_capable=true
          fi
          if [[ -n "${RELEASE_MODULE}" && "${RELEASE_DRY_RUN}" != true ]]; then
            echo 'release_module requires release_dry_run: true' >&2
            exit 1
          fi
          if [[ "${RELEASE_DRY_RUN}" == true ]]; then
            if [[ -n "${RELEASE_MODULE}" ]]; then
              matrix="$(jq -c --arg module "${RELEASE_MODULE}" '[.modules[] | select(.releasable == true and .directory == $module) | {directory, artifact: (if .directory == "." then "root" else (.directory | gsub("/"; "-")) end)}]' <<<"${inventory}")"
            else
              matrix="$(jq -c '[.modules[] | select(.releasable == true) | {directory, artifact: (if .directory == "." then "root" else (.directory | gsub("/"; "-")) end)}]' <<<"${inventory}")"
            fi
          else
            matrix="$(jq -c '[.modules[] | {directory, artifact: (if .directory == "." then "root" else (.directory | gsub("/"; "-")) end)}]' <<<"${inventory}")"
          fi
          if [[ -n "${RELEASE_MODULE}" && "$(jq 'length' <<<"${matrix}")" -ne 1 ]]; then
            echo "release module is unknown or not releasable: ${RELEASE_MODULE}" >&2
            exit 1
          fi
          if [[ "${RELEASE_DRY_RUN}" == true && "${release_module_capable}" != true ]]; then
            matrix='[{"directory":".","artifact":"legacy-all"}]'
          fi
          [[ "$(jq 'length' <<<"${matrix}")" -gt 0 ]]
          {
            echo "matrix=${matrix}"
            echo "deno=$(jq -r '.runtimes.deno // empty' <<<"${configuration}")"
            echo "zsh=$(jq -r '.runtimes.zsh // empty' <<<"${configuration}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Audit tracked source documentation when explicitly adopted
        if: inputs.source_documentation != ''
        env:
          SOURCE_DOCUMENTATION: ${{ inputs.source_documentation }}
        run: |
          set -euo pipefail
          case "${SOURCE_DOCUMENTATION}" in
            inventory|check) golib source-docs "${SOURCE_DOCUMENTATION}" --json ;;
            *) echo 'source_documentation must be blank, inventory or check' >&2; exit 1 ;;
          esac
      - name: Remove source bootstrap workspace
        if: always() && inputs.source_bootstrap == true
        env:
          SOURCE_BOOTSTRAP: ${{ inputs.source_bootstrap }}
        run: |
          set -euo pipefail
          if [[ -z "${GOLIB_SOURCE_INSTALL_ROOT:-}" ]]; then
            exit 0
          fi
          printf 'TMPDIR=%s\n' "${RUNNER_TEMP}" >>"${GITHUB_ENV}"
          case "${GOLIB_SOURCE_INSTALL_ROOT}" in
            "${RUNNER_TEMP}"/golib-source-install.*/*) echo 'unexpected source bootstrap workspace' >&2; exit 1 ;;
            "${RUNNER_TEMP}"/golib-source-install.*) ;;
            *) echo 'unexpected source bootstrap workspace' >&2; exit 1 ;;
          esac
          [[ ! -L "${GOLIB_SOURCE_INSTALL_ROOT}" ]] || { echo 'unexpected source bootstrap workspace' >&2; exit 1; }
          if [[ -d "${GOLIB_SOURCE_INSTALL_ROOT}" ]]; then
            chmod -R u+w "${GOLIB_SOURCE_INSTALL_ROOT}"
            find "${GOLIB_SOURCE_INSTALL_ROOT}" -depth -delete
          fi
          test ! -e "${GOLIB_SOURCE_INSTALL_ROOT}"

  repository-contract:
    name: Repository contract
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: ${{ inputs.tooling_sha }}
          path: .golib-tooling
          persist-credentials: false
      - uses: faustbrian/go-library-tools/.github/actions/setup-golib@e8c0c51cc517dfede5475858bb417f0e7a21f39d
        if: inputs.source_bootstrap != true
      - name: Prepare same-run source installation
        if: inputs.source_bootstrap == true
        env:
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.source_artifact_id }}
          BINARY_SHA256: ${{ needs.prepare.outputs.source_binary_sha256 }}
        run: bash .golib-tooling/tools/reuse-source-golib.sh prepare
      - name: Download same-run source verifier
        if: inputs.source_bootstrap == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.source_artifact_id }}
          path: ${{ env.GOLIB_SOURCE_INSTALL_ROOT }}/bin
          merge-multiple: true
          digest-mismatch: error
      - name: Validate and install source verifier
        if: inputs.source_bootstrap == true
        env:
          BINARY_SHA256: ${{ needs.prepare.outputs.source_binary_sha256 }}
        run: bash .golib-tooling/tools/reuse-source-golib.sh install
      - name: Select public dependency authority
        if: inputs.public_dependencies == true
        run: |
          set -euo pipefail
          printf '%s\n' 'GOPROXY=https://proxy.golang.org' 'GOSUMDB=sum.golang.org' \
            'GOPRIVATE=' 'GONOPROXY=' 'GONOSUMDB=' >>"${GITHUB_ENV}"
      - run: golib repository check
      - run: golib workflows check
      - run: golib cohesion check
      - run: golib specification check
      - name: Validate metadata documentation locally
        if: needs.prepare.outputs.runtime == 'false'
        run: |
          set -euo pipefail
          golib_help="$(golib --help)"
          if ! grep -Fq 'golib docs check --local' <<<"${golib_help}"; then
            echo 'this workflow requires bounded local documentation checks; adopt qualified capable tooling or explicit immutable source_bootstrap' >&2
            exit 1
          fi
          golib docs check --local
      - name: Scan metadata-only changes for secrets
        if: needs.prepare.outputs.runtime == 'false'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == pull_request || "${EVENT_NAME}" == push ]]; then
            golib_help="$(golib --help)"
            if ! grep -Fq 'golib secrets check [--base-sha <commit>]' <<<"${golib_help}"; then
              echo 'this workflow requires changed-content secret checks; adopt qualified capable tooling or explicit immutable source_bootstrap' >&2
              exit 1
            fi
            golib secrets check --base-sha "${BASE_SHA:-}"
          else
            golib secrets check
          fi
      - name: Monitor upstream specification drift
        if: github.event_name == 'schedule'
        run: golib specification check --online
      - name: Validate release contract
        if: inputs.release_dry_run == true
        env:
          RELEASE_MODULE: ${{ inputs.release_module }}
        run: |
          set -euo pipefail
          golib_help="$(golib --help)"
          if [[ -n "${RELEASE_MODULE}" ]] && grep -Fq 'golib release check [--all|--module <directory>]' <<<"${golib_help}"; then
            golib release check --module "${RELEASE_MODULE}"
          else
            golib release check
          fi

      - name: Remove source bootstrap workspace
        if: always() && inputs.source_bootstrap == true
        env:
          SOURCE_BOOTSTRAP: ${{ inputs.source_bootstrap }}
        run: |
          set -euo pipefail
          if [[ -z "${GOLIB_SOURCE_INSTALL_ROOT:-}" ]]; then
            exit 0
          fi
          printf 'TMPDIR=%s\n' "${RUNNER_TEMP}" >>"${GITHUB_ENV}"
          case "${GOLIB_SOURCE_INSTALL_ROOT}" in
            "${RUNNER_TEMP}"/golib-source-install.*/*) echo 'unexpected source bootstrap workspace' >&2; exit 1 ;;
            "${RUNNER_TEMP}"/golib-source-install.*) ;;
            *) echo 'unexpected source bootstrap workspace' >&2; exit 1 ;;
          esac
          [[ ! -L "${GOLIB_SOURCE_INSTALL_ROOT}" ]] || { echo 'unexpected source bootstrap workspace' >&2; exit 1; }
          if [[ -d "${GOLIB_SOURCE_INSTALL_ROOT}" ]]; then
            chmod -R u+w "${GOLIB_SOURCE_INSTALL_ROOT}"
            find "${GOLIB_SOURCE_INSTALL_ROOT}" -depth -delete
          fi
          test ! -e "${GOLIB_SOURCE_INSTALL_ROOT}"

  quality:
    name: Quality / selected modules
    needs: prepare
    if: needs.prepare.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        if: needs.prepare.outputs.deno != ''
        with:
          deno-version: ${{ needs.prepare.outputs.deno }}
          cache: false
      - name: Set up zsh runtime
        if: needs.prepare.outputs.zsh != ''
        env:
          ZSH_VERSION: ${{ needs.prepare.outputs.zsh }}
          ZSH_DEB_SHA256: bd5cc8dd3a01a6db38c0a815d75202c356a9c7f378674ba7bed9bc86dcba8af0
        run: |
          set -euo pipefail
          [[ "${ZSH_VERSION}" == '5.9' ]]
          archive="${RUNNER_TEMP}/zsh.deb"
          root="${RUNNER_TEMP}/zsh-runtime"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            'https://archive.ubuntu.com/ubuntu/pool/main/z/zsh/zsh_5.9-6ubuntu2_amd64.deb' \
            --output "${archive}"
          printf '%s  %s\n' "${ZSH_DEB_SHA256}" "${archive}" | sha256sum --check -
          mkdir -p "${root}"
          dpkg-deb --extract "${archive}" "${root}"
          echo "${root}/bin" >>"${GITHUB_PATH}"
          "${root}/bin/zsh" --version | grep -Eq '^zsh 5\.9 '
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: ${{ inputs.tooling_sha }}
          path: .golib-tooling
          persist-credentials: false
      - uses: faustbrian/go-library-tools/.github/actions/setup-golib@e8c0c51cc517dfede5475858bb417f0e7a21f39d
        if: inputs.source_bootstrap != true
      - name: Prepare same-run source installation
        if: inputs.source_bootstrap == true
        env:
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.source_artifact_id }}
          BINARY_SHA256: ${{ needs.prepare.outputs.source_binary_sha256 }}
        run: bash .golib-tooling/tools/reuse-source-golib.sh prepare
      - name: Download same-run source verifier
        if: inputs.source_bootstrap == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.source_artifact_id }}
          path: ${{ env.GOLIB_SOURCE_INSTALL_ROOT }}/bin
          merge-multiple: true
          digest-mismatch: error
      - name: Validate and install source verifier
        if: inputs.source_bootstrap == true
        env:
          BINARY_SHA256: ${{ needs.prepare.outputs.source_binary_sha256 }}
        run: bash .golib-tooling/tools/reuse-source-golib.sh install
      - uses: faustbrian/go-library-tools/.github/actions/setup-bootstrap-proxy@712163686bea3c3ad465acdca026b4b7bf5f0b0b
        if: inputs.public_dependencies != true
        with:
          bootstrap_url: ${{ vars.GOLIB_BOOTSTRAP_PROXY_URL }}
          bootstrap_sha256: ${{ vars.GOLIB_BOOTSTRAP_PROXY_SHA256 }}
      - name: Select public dependency authority
        if: inputs.public_dependencies == true
        run: |
          set -euo pipefail
          printf '%s\n' 'GOPROXY=https://proxy.golang.org' 'GOSUMDB=sum.golang.org' \
            'GOPRIVATE=' 'GONOPROXY=' 'GONOSUMDB=' >>"${GITHUB_ENV}"
      - name: Run repository module contracts
        env:
          MODULE_MATRIX: ${{ needs.prepare.outputs.matrix }}
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          golib_help="$(golib --help)"
          if ! grep -Fq 'golib check [--local]' <<<"${golib_help}"; then
            echo 'this workflow requires bounded check --local; select a qualified capable release or explicit immutable source_bootstrap' >&2
            exit 1
          fi
          if ! grep -Fq 'golib check --local --module <directory> [--module <directory> ...]' <<<"${golib_help}"; then
            echo 'this workflow requires repeated local module selection; select a qualified capable release or explicit immutable source_bootstrap' >&2
            exit 1
          fi
          if ! directory_lines="$(jq -er '
            if type == "array" and length > 0 and length <= 64 and
               all(.[]; (.directory | type == "string" and length > 0 and (test("[[:cntrl:]]") | not)))
            then .[].directory else error("invalid selected module matrix") end
          ' <<<"${MODULE_MATRIX}" 2>/dev/null)"; then
            echo 'invalid selected module matrix' >&2
            exit 1
          fi
          arguments=(check --local)
          if [[ "${EVENT_NAME:-}" == pull_request || "${EVENT_NAME:-}" == push ]]; then
            if ! grep -Fq 'golib check --local --base-sha <commit> [--all|--module <directory> ...]' <<<"${golib_help}"; then
              echo 'this workflow requires changed-target fuzz smoke; select a qualified capable release or explicit immutable source_bootstrap' >&2
              exit 1
            fi
            if ! grep -Fq 'golib secrets check [--base-sha <commit>]' <<<"${golib_help}"; then
              echo 'this workflow requires changed-content secret checks; select a qualified capable release or explicit immutable source_bootstrap' >&2
              exit 1
            fi
            arguments+=(--base-sha "${BASE_SHA:-}")
          fi
          while IFS= read -r directory; do
            arguments+=(--module "${directory}")
          done <<<"${directory_lines}"
          golib "${arguments[@]}"
      - name: Run release rehearsal
        if: inputs.release_dry_run == true
        env:
          RELEASE_MODULE: ${{ inputs.release_module }}
        run: |
          if golib --help | grep -Fq 'golib release dry-run [--all|--module <directory>]'; then
            if [[ -n "${RELEASE_MODULE}" ]]; then
              golib release dry-run --module "${RELEASE_MODULE}"
            else
              golib release dry-run --all
            fi
          else
            golib release dry-run
          fi
      - name: Upload attributable evidence
        if: always() && hashFiles('.verification/**') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-selected-modules
          path: .verification
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Remove source bootstrap workspace
        if: always() && inputs.source_bootstrap == true
        env:
          SOURCE_BOOTSTRAP: ${{ inputs.source_bootstrap }}
        run: |
          set -euo pipefail
          if [[ -z "${GOLIB_SOURCE_INSTALL_ROOT:-}" ]]; then
            exit 0
          fi
          printf 'TMPDIR=%s\n' "${RUNNER_TEMP}" >>"${GITHUB_ENV}"
          case "${GOLIB_SOURCE_INSTALL_ROOT}" in
            "${RUNNER_TEMP}"/golib-source-install.*/*) echo 'unexpected source bootstrap workspace' >&2; exit 1 ;;
            "${RUNNER_TEMP}"/golib-source-install.*) ;;
            *) echo 'unexpected source bootstrap workspace' >&2; exit 1 ;;
          esac
          [[ ! -L "${GOLIB_SOURCE_INSTALL_ROOT}" ]] || { echo 'unexpected source bootstrap workspace' >&2; exit 1; }
          if [[ -d "${GOLIB_SOURCE_INSTALL_ROOT}" ]]; then
            chmod -R u+w "${GOLIB_SOURCE_INSTALL_ROOT}"
            find "${GOLIB_SOURCE_INSTALL_ROOT}" -depth -delete
          fi
          test ! -e "${GOLIB_SOURCE_INSTALL_ROOT}"

  codeql:
    name: CodeQL
    needs: prepare
    if: needs.prepare.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 120 }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: faustbrian/go-library-tools
          ref: ${{ inputs.tooling_sha }}
          path: .golib-tooling
          persist-credentials: false
      - uses: faustbrian/go-library-tools/.github/actions/setup-golib@e8c0c51cc517dfede5475858bb417f0e7a21f39d
        if: inputs.source_bootstrap != true
      - name: Prepare same-run source installation
        if: inputs.source_bootstrap == true
        env:
          TOOLING_SHA: ${{ inputs.tooling_sha }}
          ARTIFACT_ID: ${{ needs.prepare.outputs.source_artifact_id }}
          BINARY_SHA256: ${{ needs.prepare.outputs.source_binary_sha256 }}
        run: bash .golib-tooling/tools/reuse-source-golib.sh prepare
      - name: Download same-run source verifier
        if: inputs.source_bootstrap == true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.source_artifact_id }}
          path: ${{ env.GOLIB_SOURCE_INSTALL_ROOT }}/bin
          merge-multiple: true
          digest-mismatch: error
      - name: Validate and install source verifier
        if: inputs.source_bootstrap == true
        env:
          BINARY_SHA256: ${{ needs.prepare.outputs.source_binary_sha256 }}
        run: bash .golib-tooling/tools/reuse-source-golib.sh install
      - uses: faustbrian/go-library-tools/.github/actions/setup-bootstrap-proxy@712163686bea3c3ad465acdca026b4b7bf5f0b0b
        if: inputs.public_dependencies != true
        with:
          bootstrap_url: ${{ vars.GOLIB_BOOTSTRAP_PROXY_URL }}
          bootstrap_sha256: ${{ vars.GOLIB_BOOTSTRAP_PROXY_SHA256 }}
      - name: Select public dependency authority
        if: inputs.public_dependencies == true
        run: |
          set -euo pipefail
          printf '%s\n' 'GOPROXY=https://proxy.golang.org' 'GOSUMDB=sum.golang.org' \
            'GOPRIVATE=' 'GONOPROXY=' 'GONOSUMDB=' >>"${GITHUB_ENV}"
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          tools: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.zst
          languages: go
          build-mode: manual
          queries: security-extended,security-and-quality
      - name: Build selected modules
        env:
          MODULE_MATRIX: ${{ needs.prepare.outputs.matrix }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_DRY_RUN: ${{ inputs.release_dry_run }}
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-codeql.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          export GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" GOWORK=off
          inventory="$(golib inventory --json)"
          if [[ "${EVENT_NAME}" == pull_request && "${RELEASE_DRY_RUN}" != true ]]; then
            # Main/scheduled analysis stays complete: a partial PR database is
            # not a replacement for repository-wide branch scanning coverage.
            if [[ -z "${MODULE_MATRIX:-}" || "${#MODULE_MATRIX}" -gt 65536 ]]; then
              echo 'invalid CodeQL module selection' >&2
              exit 1
            fi
            if ! records="$(jq -er --argjson selected "${MODULE_MATRIX}" '
              .modules as $modules |
              if ($selected | type == "array" and length > 0 and length <= 64) and
                 all($selected[]; type == "object" and
                   (.directory | type == "string" and length > 0 and (test("[[:cntrl:]]") | not))) and
                 ([$selected[].directory] | unique | length) == ($selected | length)
              then
                $selected[] | .directory as $directory |
                [$modules[] | select(.directory == $directory)] as $matches |
                if ($matches | length) == 1 then $matches[0]
                else error("unknown CodeQL module") end
              else error("invalid CodeQL module selection") end |
              [.directory, ((.build_tags // []) | join(","))] | @tsv
            ' <<<"${inventory}" 2>/dev/null)"; then
              echo 'invalid CodeQL module selection' >&2
              exit 1
            fi
          else
            records="$(jq -er '
              .modules | if type == "array" and length > 0 and length <= 64
              then .[] else error("invalid CodeQL inventory") end |
              [.directory, ((.build_tags // []) | join(","))] | @tsv
            ' <<<"${inventory}")"
          fi
          while IFS=$'\t' read -r module tags; do
            if [[ -n "${tags}" ]]; then
              (cd "${module}" && go build -tags="${tags}" ./...)
            else
              (cd "${module}" && go build ./...)
            fi
          done <<<"${records}"
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

      - name: Remove source bootstrap workspace
        if: always() && inputs.source_bootstrap == true
        env:
          SOURCE_BOOTSTRAP: ${{ inputs.source_bootstrap }}
        run: |
          set -euo pipefail
          if [[ -z "${GOLIB_SOURCE_INSTALL_ROOT:-}" ]]; then
            exit 0
          fi
          printf 'TMPDIR=%s\n' "${RUNNER_TEMP}" >>"${GITHUB_ENV}"
          case "${GOLIB_SOURCE_INSTALL_ROOT}" in
            "${RUNNER_TEMP}"/golib-source-install.*/*) echo 'unexpected source bootstrap workspace' >&2; exit 1 ;;
            "${RUNNER_TEMP}"/golib-source-install.*) ;;
            *) echo 'unexpected source bootstrap workspace' >&2; exit 1 ;;
          esac
          [[ ! -L "${GOLIB_SOURCE_INSTALL_ROOT}" ]] || { echo 'unexpected source bootstrap workspace' >&2; exit 1; }
          if [[ -d "${GOLIB_SOURCE_INSTALL_ROOT}" ]]; then
            chmod -R u+w "${GOLIB_SOURCE_INSTALL_ROOT}"
            find "${GOLIB_SOURCE_INSTALL_ROOT}" -depth -delete
          fi
          test ! -e "${GOLIB_SOURCE_INSTALL_ROOT}"

  required:
    name: Required
    if: always()
    needs: [dependency-review, prepare, repository-contract, quality, codeql]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every repository result
        env:
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CONTRACT_RESULT: ${{ needs.repository-contract.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          RUNTIME: ${{ needs.prepare.outputs.runtime }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "${PREPARE_RESULT}" = success
          test "${CONTRACT_RESULT}" = success
          if [[ "${RUNTIME}" == true ]]; then
            test "${QUALITY_RESULT}" = success
            test "${CODEQL_RESULT}" = success
          elif [[ "${RUNTIME}" == false ]]; then
            test "${QUALITY_RESULT}" = skipped
            test "${CODEQL_RESULT}" = skipped
          else
            echo 'missing or invalid change classification' >&2
            exit 1
          fi
          if [[ "${EVENT_NAME}" == pull_request ]]; then
            test "${DEPENDENCY_REVIEW_RESULT}" = success
          else
            test "${DEPENDENCY_REVIEW_RESULT}" = skipped
          fi
