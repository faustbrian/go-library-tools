name: Compatibility rehearsal

on:
  workflow_dispatch:
    inputs:
      compatibility_source_run_id:
        description: Existing run containing ten successful compatibility artifacts
        required: false
        type: string
      performance_source_run_id:
        description: Existing run containing four successful performance artifacts
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: go-library-tools-compatibility-rehearsal
  cancel-in-progress: false

jobs:
  select:
    name: Select representatives
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      performance: ${{ steps.matrix.outputs.performance }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - id: matrix
        env:
          MANIFEST: rehearsals/repositories.json
        run: |
          set -euo pipefail
          jq -e '
            .schema_version == 1 and
            (.repositories | length == 5) and
            all(.repositories[];
              (.name | test("^go-[a-z0-9-]+$")) and
              (.revision | test("^[0-9a-f]{40}$")) and
              (.performance_profile == null or
                .performance_profile == "core" or
                .performance_profile == "service")) and
            ([.repositories[].performance_profile | select(. != null)] | sort) ==
              ["core", "service"]
          ' "${MANIFEST}" >/dev/null
          echo "value=$(jq -c '.repositories' "${MANIFEST}")" >>"${GITHUB_OUTPUT}"
          echo "performance=$(jq -c '[
            .repositories[] |
            select(.performance_profile != null) as $repository |
            ["legacy", "shared"][] as $implementation |
            $repository + {
              implementation: $implementation,
              artifact: ($repository.name + "-" + $implementation)
            }
          ]' "${MANIFEST}")" >>"${GITHUB_OUTPUT}"

  legacy:
    name: Legacy / ${{ matrix.name }}
    if: inputs.compatibility_source_run_id == ''
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      GOPRIVATE: github.com/faustbrian/*
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: tooling
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: faustbrian/${{ matrix.name }}
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          path: source
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/.go-version
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.4.1'
          package-manager-cache: false
      - name: Prepare content-identical source
        working-directory: source
        run: ../tooling/rehearsals/prepare.sh "${RUNNER_TEMP}/legacy-content.sha256"
      - name: Prepare isolated dependency sums
        working-directory: source
        run: |
          ../tooling/rehearsals/prepare-dependencies.sh \
            "${RUNNER_TEMP}/legacy-dependencies" "${GITHUB_ENV}" "${GITHUB_PATH}"
      - name: Restore mutation checkpoints
        working-directory: source
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r module artifact; do
            seed=".golib/mutation-bootstrap/${artifact}.zip"
            test -s "${seed}"
            ./.golib/scripts/restore-ci-mutation-evidence.sh \
              "${module}" "${seed}"
          done < <(jq -r '
            .modules[] |
            select(.gates.mutation == true) |
            [
              .directory,
              (if .directory == "." then
                "root"
              else
                (.directory | gsub("/"; "-"))
              end)
            ] |
            @tsv
          ' modules.json)
      - name: Run copied contract
        working-directory: source
        run: |
          set +e
          set -o pipefail
          make ci 2>&1 | tee "${RUNNER_TEMP}/legacy.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "${status}" >"${RUNNER_TEMP}/legacy-check.status"
          exit "${status}"
      - name: Record release decision
        if: always()
        working-directory: source
        run: |
          set +e
          status=0
          while IFS= read -r module; do
            ./.golib/scripts/with-disposable-go-cache.sh \
              ./.golib/scripts/release.sh --dry-run "${module}" \
              >>"${RUNNER_TEMP}/legacy-release.log" 2>&1 || status=$?
          done < <(jq -r '.modules[] | select(.releasable == true) | .directory' modules.json)
          printf '%s\n' "${status}" >"${RUNNER_TEMP}/legacy-release.status"
          exit 0
      - name: Audit service cleanup
        if: always()
        working-directory: source
        run: ../tooling/rehearsals/audit-services.sh "${RUNNER_TEMP}/legacy-services.status"
      - name: Summarize legacy result
        if: always()
        working-directory: source
        run: |
          ../tooling/rehearsals/summarize.sh legacy \
            "${RUNNER_TEMP}/legacy.log" \
            "${RUNNER_TEMP}/legacy-content.sha256" \
            "${RUNNER_TEMP}/legacy-check.status" \
            "${RUNNER_TEMP}/legacy-release.log" \
            "${RUNNER_TEMP}/legacy-release.status" \
            "${RUNNER_TEMP}/legacy-services.status" \
            "${RUNNER_TEMP}/legacy-summary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: parity-legacy-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/legacy.log
            ${{ runner.temp }}/legacy-release.log
            ${{ runner.temp }}/legacy-summary
          if-no-files-found: error
          retention-days: 14

  shared:
    name: Shared / ${{ matrix.name }}
    if: inputs.compatibility_source_run_id == ''
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      GOPRIVATE: github.com/faustbrian/*
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: tooling
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: faustbrian/${{ matrix.name }}
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          path: source
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/.go-version
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.4.1'
          package-manager-cache: false
      - name: Build source CLI
        working-directory: tooling
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-parity-build.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            GOTOOLCHAIN=auto \
            go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/golib" ./cmd/golib
      - name: Prepare content-identical source
        working-directory: source
        run: ../tooling/rehearsals/prepare.sh "${RUNNER_TEMP}/shared-content.sha256"
      - name: Prepare isolated dependency sums
        working-directory: source
        run: |
          ../tooling/rehearsals/prepare-dependencies.sh \
            "${RUNNER_TEMP}/shared-dependencies" "${GITHUB_ENV}" "${GITHUB_PATH}"
      - name: Apply rehearsal policy
        working-directory: source
        env:
          FIXTURE: ../tooling/rehearsals/${{ matrix.name }}
        run: |
          set -euo pipefail
          cp "${FIXTURE}/.golib.yaml" .golib.yaml
          mkdir -p .verification/mutation/bootstrap
          cp .golib/mutation-bootstrap/*.zip \
            .verification/mutation/bootstrap/
          cp .golib/mutation-history-migrations.json \
            .verification/mutation/migration-ledger.json
          cp "${FIXTURE}/verification/mutation/zero-inventory.json" \
            .verification/mutation/zero-inventory.json
          if [[ -f "${FIXTURE}/verification/package.mk" ]]; then
            mkdir -p verification
            cp "${FIXTURE}/verification/package.mk" verification/package.mk
          fi
          {
            printf '%s\n' '/.golib.yaml' '/.verification/'
            [[ ! -f "${FIXTURE}/verification/package.mk" ]] || \
              printf '%s\n' '/verification/package.mk'
          } >>.git/info/exclude
      - name: Run shared contract
        working-directory: source
        run: |
          set +e
          set -o pipefail
          {
            status=0
            copied_tooling="${RUNNER_TEMP}/shared-copied-tooling-${{ matrix.name }}"
            restore_copied_tooling() {
              if [[ -d "${copied_tooling}" && ! -e .golib ]]; then
                mv "${copied_tooling}" .golib
              fi
            }
            trap restore_copied_tooling EXIT HUP INT TERM
            mv .golib "${copied_tooling}"
            "${RUNNER_TEMP}/golib" repository check || status=$?
            restore_copied_tooling
            trap - EXIT HUP INT TERM
            "${RUNNER_TEMP}/golib" check --all || status=$?
            exit "${status}"
          } 2>&1 | tee "${RUNNER_TEMP}/shared.log"
          status=${PIPESTATUS[0]}
          printf '%s\n' "${status}" >"${RUNNER_TEMP}/shared-check.status"
          exit "${status}"
      - name: Record release decision
        if: always()
        working-directory: source
        run: |
          set +e
          copied_tooling="${RUNNER_TEMP}/shared-release-copied-tooling-${{ matrix.name }}"
          restore_copied_tooling() {
            if [[ -d "${copied_tooling}" && ! -e .golib ]]; then
              mv "${copied_tooling}" .golib
            fi
          }
          trap restore_copied_tooling EXIT HUP INT TERM
          mv .golib "${copied_tooling}"
          "${RUNNER_TEMP}/golib" release dry-run \
            >"${RUNNER_TEMP}/shared-release.log" 2>&1
          status=$?
          restore_copied_tooling
          trap - EXIT HUP INT TERM
          printf '%s\n' "${status}" >"${RUNNER_TEMP}/shared-release.status"
          exit 0
      - name: Audit service cleanup
        if: always()
        working-directory: source
        run: ../tooling/rehearsals/audit-services.sh "${RUNNER_TEMP}/shared-services.status"
      - name: Summarize shared result
        if: always()
        working-directory: source
        run: |
          ../tooling/rehearsals/summarize.sh shared \
            "${RUNNER_TEMP}/shared.log" \
            "${RUNNER_TEMP}/shared-content.sha256" \
            "${RUNNER_TEMP}/shared-check.status" \
            "${RUNNER_TEMP}/shared-release.log" \
            "${RUNNER_TEMP}/shared-release.status" \
            "${RUNNER_TEMP}/shared-services.status" \
            "${RUNNER_TEMP}/shared-summary"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: parity-shared-${{ matrix.name }}
          path: |
            ${{ runner.temp }}/shared.log
            ${{ runner.temp }}/shared-release.log
            ${{ runner.temp }}/shared-summary
          if-no-files-found: error
          retention-days: 14

  performance:
    name: Performance / ${{ matrix.name }} / ${{ matrix.implementation }}
    if: inputs.performance_source_run_id == ''
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select.outputs.performance) }}
    env:
      GOPRIVATE: github.com/faustbrian/*
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: tooling
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: faustbrian/${{ matrix.name }}
          ref: ${{ matrix.revision }}
          fetch-depth: 0
          path: source
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/.go-version
          cache: false
      - name: Build source CLI
        working-directory: tooling
        run: |
          set -euo pipefail
          task="$(mktemp -d "${RUNNER_TEMP}/golib-performance-build.XXXXXX")"
          trap 'chmod -R u+w "${task}" 2>/dev/null || true; find "${task}" -depth -delete' EXIT
          mkdir -p "${task}/cache" "${task}/mod" "${task}/tmp"
          GOCACHE="${task}/cache" GOMODCACHE="${task}/mod" GOTMPDIR="${task}/tmp" \
            GOTOOLCHAIN=auto \
            go build -trimpath -buildvcs=false -o "${RUNNER_TEMP}/golib" ./cmd/golib
      - name: Prepare content-identical source
        working-directory: source
        run: ../tooling/rehearsals/prepare.sh "${RUNNER_TEMP}/performance-content.sha256"
      - name: Prepare isolated dependency sums
        working-directory: source
        run: |
          ../tooling/rehearsals/prepare-dependencies.sh \
            "${RUNNER_TEMP}/performance-dependencies" "${GITHUB_ENV}" "${GITHUB_PATH}"
      - name: Apply shared rehearsal policy
        if: matrix.implementation == 'shared'
        working-directory: source
        env:
          FIXTURE: ../tooling/rehearsals/${{ matrix.name }}
        run: |
          set -euo pipefail
          cp "${FIXTURE}/.golib.yaml" .golib.yaml
          mkdir -p .verification/mutation/bootstrap
          cp .golib/mutation-bootstrap/*.zip \
            .verification/mutation/bootstrap/
          cp .golib/mutation-history-migrations.json \
            .verification/mutation/migration-ledger.json
          cp "${FIXTURE}/verification/mutation/zero-inventory.json" \
            .verification/mutation/zero-inventory.json
          if [[ -f "${FIXTURE}/verification/package.mk" ]]; then
            mkdir -p verification
            cp "${FIXTURE}/verification/package.mk" verification/package.mk
          fi
          {
            printf '%s\n' '/.golib.yaml' '/.verification/'
            [[ ! -f "${FIXTURE}/verification/package.mk" ]] || \
              printf '%s\n' '/verification/package.mk'
          } >>.git/info/exclude
      - name: Measure content-identical contract
        working-directory: source
        run: |
          ../tooling/rehearsals/performance.sh \
            '${{ matrix.implementation }}' \
            . "${RUNNER_TEMP}/golib" '${{ matrix.name }}' '${{ matrix.revision }}' \
            "$(cat "${RUNNER_TEMP}/performance-content.sha256")" \
            '${{ matrix.performance_profile }}' \
            "$(git -C ../tooling rev-parse HEAD)" \
            >"${RUNNER_TEMP}/performance.json"
      - name: Audit service cleanup
        if: always()
        working-directory: source
        run: ../tooling/rehearsals/audit-services.sh "${RUNNER_TEMP}/performance-services.status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: performance-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/performance.json
            ${{ runner.temp }}/performance-services.status
          if-no-files-found: error
          retention-days: 14

  performance-report:
    name: Compare performance measurements
    if: always() && (needs.performance.result == 'success' || inputs.performance_source_run_id != '')
    needs: performance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve measurement source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.performance_source_run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${REQUESTED_RUN_ID}" ]]; then
            run_id="${GITHUB_RUN_ID}"
            run_attempt="${GITHUB_RUN_ATTEMPT}"
            tooling_revision="${GITHUB_SHA}"
          else
            [[ "${REQUESTED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            metadata="$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}")"
            jq -e \
              --argjson run_id "${REQUESTED_RUN_ID}" \
              --arg repository "${GITHUB_REPOSITORY}" '
                .id == $run_id and
                .repository.full_name == $repository and
                .path == ".github/workflows/parity-rehearsal.yml" and
                .event == "workflow_dispatch" and
                .status == "completed" and
                (.head_sha | test("^[0-9a-f]{40}$")) and
                .run_attempt > 0
              ' <<<"${metadata}" >/dev/null
            run_id="$(jq -r .id <<<"${metadata}")"
            run_attempt="$(jq -r .run_attempt <<<"${metadata}")"
            tooling_revision="$(jq -r .head_sha <<<"${metadata}")"
          fi
          {
            printf 'run_id=%s\n' "${run_id}"
            printf 'run_attempt=%s\n' "${run_attempt}"
            printf 'tooling_revision=%s\n' "${tooling_revision}"
          } >>"${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: performance-*
          path: performance-results
          github-token: ${{ github.token }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Validate comparable raw results
        run: |
          ./rehearsals/performance-compare.sh \
            performance-results performance-results.json \
            '${{ steps.source.outputs.run_id }}' \
            '${{ steps.source.outputs.run_attempt }}' \
            '${{ steps.source.outputs.tooling_revision }}' \
            '${{ github.repository }}' \
            rehearsals/repositories.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: performance-results
          path: performance-results.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare contracts
    if: >-
      always() && needs.select.result == 'success' &&
      ((needs.legacy.result == 'success' && needs.shared.result == 'success') ||
      inputs.compatibility_source_run_id != '')
    needs: [select, legacy, shared]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve compatibility source
        id: contract-source
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.compatibility_source_run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${REQUESTED_RUN_ID}" ]]; then
            run_id="${GITHUB_RUN_ID}"
          else
            [[ "${REQUESTED_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            metadata="$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}")"
            jq -e \
              --argjson run_id "${REQUESTED_RUN_ID}" \
              --arg repository "${GITHUB_REPOSITORY}" '
                .id == $run_id and
                .repository.full_name == $repository and
                .path == ".github/workflows/parity-rehearsal.yml" and
                .event == "workflow_dispatch" and
                .status == "completed" and
                (.head_sha | test("^[0-9a-f]{40}$"))
              ' <<<"${metadata}" >/dev/null
            source_sha="$(jq -r .head_sha <<<"${metadata}")"
            git fetch --no-tags --depth=1 origin "${source_sha}"
            changed_inputs="$(
              git diff --name-only "${source_sha}" "${GITHUB_SHA}" -- \
                .go-version go.mod go.sum cmd internal rehearsals |
                grep -Ev '(^rehearsals/compare\.sh$|_test\.go$)' || true
            )"
            if [[ -n "${changed_inputs}" ]]; then
              printf 'compatibility source inputs changed:\n%s\n' \
                "${changed_inputs}" >&2
              exit 1
            fi
            jobs_metadata="$(gh api \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${REQUESTED_RUN_ID}/jobs?per_page=100")"
            jq -e '
              ([.jobs[] | select(.name | test("^(Legacy|Shared) / go-"))] | length) == 10 and
              all(.jobs[] | select(.name | test("^(Legacy|Shared) / go-"));
                .status == "completed" and .conclusion == "success")
            ' <<<"${jobs_metadata}" >/dev/null
            run_id="$(jq -r .id <<<"${metadata}")"
          fi
          printf 'run_id=%s\n' "${run_id}" >>"${GITHUB_OUTPUT}"
      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          pattern: parity-*
          path: results
          github-token: ${{ github.token }}
          run-id: ${{ steps.contract-source.outputs.run_id }}
      - name: Require equivalent results
        run: ./rehearsals/compare.sh results rehearsals/repositories.json
