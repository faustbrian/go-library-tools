name: Set up bootstrap module proxy
description: Verify and expose an optional immutable Go module proxy archive
inputs:
  bootstrap_url:
    description: HTTPS URL of the bootstrap proxy archive
    required: false
  bootstrap_sha256:
    description: SHA-256 digest of the bootstrap proxy archive
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        BOOTSTRAP_URL: ${{ inputs.bootstrap_url }}
        BOOTSTRAP_SHA256: ${{ inputs.bootstrap_sha256 }}
      run: |
        bash "${GITHUB_ACTION_PATH}/setup.sh"
