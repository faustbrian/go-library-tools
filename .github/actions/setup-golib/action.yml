name: Set up golib
description: Install the verified declared release or explicitly selected immutable development source

inputs:
  source_bootstrap:
    description: Build the exact checked-out development source instead of installing a release
    required: false
    default: 'false'
  tooling_sha:
    description: Exact go-library-tools commit at the fixed .golib-tooling checkout
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Validate bootstrap selection
      shell: bash
      env:
        SOURCE_BOOTSTRAP: ${{ inputs.source_bootstrap }}
      run: |
        set -euo pipefail
        case "${SOURCE_BOOTSTRAP}" in
          true|false) ;;
          *) echo 'source_bootstrap must be true or false' >&2; exit 1 ;;
        esac
    - name: Build exact source golib
      if: inputs.source_bootstrap == 'true'
      shell: bash
      env:
        TOOLING_SHA: ${{ inputs.tooling_sha }}
        GOENV: 'off'
        GOWORK: 'off'
        GOTOOLCHAIN: local
        GOMAXPROCS: '2'
        GOFLAGS: -p=1
        GOPROXY: https://proxy.golang.org
        GOSUMDB: sum.golang.org
        GOPRIVATE: ''
        GONOPROXY: ''
        GONOSUMDB: ''
      run: |
        set -euo pipefail
        [[ "${TOOLING_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo 'tooling_sha must be an immutable lowercase commit' >&2; exit 1; }
        source_root="${GITHUB_WORKSPACE}/.golib-tooling"
        [[ ! -L "${source_root}" ]] || { echo 'symbolic tooling checkout refused' >&2; exit 1; }
        [[ "$(git -C "${source_root}" rev-parse --show-toplevel)" == "${source_root}" ]] || { echo 'unexpected tooling checkout root' >&2; exit 1; }
        [[ "$(git -C "${source_root}" rev-parse HEAD)" == "${TOOLING_SHA}" ]] || { echo 'tooling checkout commit mismatch' >&2; exit 1; }
        case "$(git -C "${source_root}" remote get-url origin)" in
          https://github.com/faustbrian/go-library-tools|https://github.com/faustbrian/go-library-tools.git) ;;
          *) echo 'source bootstrap requires the fixed go-library-tools repository' >&2; exit 1 ;;
        esac

        checkout_status="$(git -C "${source_root}" status --porcelain=v1 --untracked-files=all --ignored 2>/dev/null)" || { echo 'cannot inspect tooling checkout cleanliness' >&2; exit 1; }
        [[ -z "${checkout_status}" ]] || { echo 'source bootstrap requires a pristine tooling checkout' >&2; exit 1; }
        index_flags="$(git -C "${source_root}" ls-files -v 2>/dev/null)" || { echo 'cannot inspect tooling index flags' >&2; exit 1; }
        if grep -Eq '^[a-zS] ' <<<"${index_flags}"; then
          echo 'source bootstrap refuses assume-unchanged or skip-worktree entries' >&2
          exit 1
        fi
        build_task="$(mktemp -d "${RUNNER_TEMP}/golib-source-build.XXXXXX")"
        install_root=''
        cleanup_build() {
          status=$?
          chmod -R u+w "${build_task}" || status=1
          find "${build_task}" -depth -delete || status=1
          if [[ "${status}" -ne 0 && -n "${install_root}" && -d "${install_root}" ]]; then
            chmod -R u+w "${install_root}" || status=1
            find "${install_root}" -depth -delete || status=1
          fi
          exit "${status}"
        }
        trap cleanup_build EXIT
        install_root="$(mktemp -d "${RUNNER_TEMP}/golib-source-install.XXXXXX")"
        echo "GOLIB_SOURCE_INSTALL_ROOT=${install_root}" >>"${GITHUB_ENV}"
        mkdir -p "${build_task}/cache" "${build_task}/mod" "${build_task}/tmp" \
          "${install_root}/bin" "${install_root}/lint" "${install_root}/xdg" "${install_root}/npm" "${install_root}/tmp"
        export GOCACHE="${build_task}/cache" GOMODCACHE="${build_task}/mod" GOTMPDIR="${build_task}/tmp"
        (cd "${source_root}" && go build -mod=readonly -trimpath -buildvcs=false -o "${install_root}/bin/golib" ./cmd/golib)
        test "$("${install_root}/bin/golib" --version)" = dev
        {
          echo "GOLANGCI_LINT_CACHE=${install_root}/lint"
          echo "XDG_CACHE_HOME=${install_root}/xdg"
          echo "NPM_CONFIG_CACHE=${install_root}/npm"
          echo "TMPDIR=${install_root}/tmp"
          echo "GOENV=off"
          echo "GOWORK=off"
          echo "GOTOOLCHAIN=local"
          echo "GOMAXPROCS=2"
          echo "GOFLAGS=-p=1"
        } >>"${GITHUB_ENV}"
        echo "${install_root}/bin" >>"${GITHUB_PATH}"
    - name: Install verified golib release
      if: inputs.source_bootstrap != 'true'
      shell: bash
      env:
        GOLIB_REPOSITORY: faustbrian/go-library-tools
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        [[ -f .golib.yaml ]]
        declarations="$(awk '$1 == "tool_version:" { print $2 }' .golib.yaml)"
        [[ "$(printf '%s\n' "${declarations}" | wc -l | tr -d ' ')" -eq 1 ]]
        version="${declarations}"
        [[ "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
        checksum_declarations="$(awk '$1 == "tool_checksums_sha256:" { print $2 }' .golib.yaml)"
        [[ "$(printf '%s\n' "${checksum_declarations}" | wc -l | tr -d ' ')" -eq 1 ]]
        checksums_sha256="${checksum_declarations}"
        [[ "${checksums_sha256}" =~ ^[0-9a-f]{64}$ ]]

        case "${RUNNER_OS}/${RUNNER_ARCH}" in
          Linux/X64) platform='linux_amd64' ;;
          Linux/ARM64) platform='linux_arm64' ;;
          macOS/X64) platform='darwin_amd64' ;;
          macOS/ARM64) platform='darwin_arm64' ;;
          *) printf 'unsupported golib platform: %s/%s\n' "${RUNNER_OS}" "${RUNNER_ARCH}" >&2; exit 1 ;;
        esac

        release="${version#v}"
        archive="golib_${release}_${platform}.tar.gz"
        install_root="${RUNNER_TEMP}/golib-${version}"
        mkdir -p "${install_root}" "${RUNNER_TEMP}/golib-bin"
        gh release download "${version}" --repo "${GOLIB_REPOSITORY}" \
          --pattern "${archive}" --pattern checksums.txt --dir "${install_root}"
        if command -v sha256sum >/dev/null 2>&1; then
          printf '%s  %s\n' "${checksums_sha256}" "${install_root}/checksums.txt" | sha256sum --check -
        else
          printf '%s  %s\n' "${checksums_sha256}" "${install_root}/checksums.txt" | shasum -a 256 --check
        fi
        checksum="$(grep -E "^[0-9a-f]{64}  ${archive}$" "${install_root}/checksums.txt")"
        [[ "$(printf '%s\n' "${checksum}" | wc -l | tr -d ' ')" -eq 1 ]]
        if command -v sha256sum >/dev/null 2>&1; then
          (cd "${install_root}" && printf '%s\n' "${checksum}" | sha256sum --check -)
        else
          (cd "${install_root}" && printf '%s\n' "${checksum}" | shasum -a 256 --check)
        fi
        gh attestation verify "${install_root}/${archive}" \
          --repo "${GOLIB_REPOSITORY}"
        tar --extract --gzip --file "${install_root}/${archive}" \
          --directory "${RUNNER_TEMP}/golib-bin" golib
        chmod 0755 "${RUNNER_TEMP}/golib-bin/golib"
        echo "${RUNNER_TEMP}/golib-bin" >>"${GITHUB_PATH}"
        "${RUNNER_TEMP}/golib-bin/golib" --version | grep -Fx "${version}"
